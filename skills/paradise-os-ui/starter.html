<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradise OS starter</title>
<style>body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px; background: #F4F1EA; font: 13px/1.4 system-ui, sans-serif; }</style>
</head>
<body>
<!-- The smallest whole Paradise control: a bevelled 95-era button drawn on a canvas, with a spring, a sound,
     keyboard focus that only shows for the keyboard, and the grey reality look. Copy this to start a new one. -->
<paradise-starter-button label="PRESS ME"></paradise-starter-button>
<button type="button" onclick="ParadiseOS.bus.emit('reality', { paradise: !ParadiseOS.bus.state.paradise })">Toggle reality</button>
<script src="core.js"></script>
<script>
(() => {
  const { Base, Spring, define, fit, start, bus, drawBevelBox, clamp, lerp } = window.ParadiseOS;
  const SND = window.ParadiseSound;

  class StarterButton extends Base {
    static delegates = true;
    static css = `
      button { all: unset; display: block; width: 180px; height: 64px; cursor: pointer; }
      button:focus-visible:not([data-pointer]) { outline: 2px solid #3CEBE2; outline-offset: 4px; }
      canvas { width: 100%; height: 100%; display: block; }`;
    render() { return `<button type="button"><canvas aria-hidden="true"></canvas></button>`; }
    setup() {
      this.btn = this.$('button');
      this.cv = this.$('canvas');
      this.btn.setAttribute('aria-label', this.getAttribute('label') || 'Button');
      this.press = new Spring(0, 520, 22);               // 0 up, 1 pressed in
      this.real = new Spring(bus.state.paradise ? 0 : 1, 180, 19);
      bus.on('reality', ({ paradise }) => { this.real.to = paradise ? 0 : 1; start(); });
      this.btn.addEventListener('keydown', () => delete this.btn.dataset.pointer, true);
      this.btn.addEventListener('pointerdown', () => { this.btn.dataset.pointer = ''; this.press.to = 1; SND?.keyTap(); start(); });
      const up = () => { this.press.to = 0; start(); };
      this.btn.addEventListener('pointerup', up);
      this.btn.addEventListener('pointerleave', up);
      this.btn.addEventListener('click', () => this.emit('action'));
    }
    frame(dt) {
      // the core calls this every frame while the element is on the page
      this.press.step(dt); this.real.step(dt);
      const [g, w, h] = fit(this.cv);
      g.clearRect(0, 0, w, h);
      const p = clamp(this.press.x), r = clamp(this.real.x);
      // paradise: a sunset gradient face; reality: flat grey
      const face = g.createLinearGradient(0, 0, w, 0);
      face.addColorStop(0, `hsl(${lerp(320, 0, r)} ${lerp(80, 0, r)}% 82%)`);
      face.addColorStop(1, `hsl(${lerp(178, 0, r)} ${lerp(70, 0, r)}% 80%)`);
      drawBevelBox(g, 2, 2 + p * 2, w - 4, h - 6, { fill: face, sunken: p > 0.5 });
      g.fillStyle = '#1B1430';
      g.font = "700 13px 'IBM Plex Mono', monospace";
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(this.getAttribute('label') || 'Button', w / 2 + p, h / 2 + p * 2);
    }
  }
  define('paradise-starter-button', StarterButton);
})();
</script>
</body>
</html>
